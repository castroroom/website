<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | The Castro Room</title>

<link rel="stylesheet" href="https://use.typekit.net/acb2tog.css">

<style>
  :root {
    --cream: #FAF9F2;
    --tan: #EAD5AA;
    --brown-1: #5e2f00;
    --brown-2: #5e2500;
    --brown-3: #612000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "proxima-nova", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 300;
    background: var(--cream);
    color: var(--brown-1);
    line-height: 1.6;
    text-transform: lowercase;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem;
    background: rgba(250, 249, 242, 0.9);
    backdrop-filter: blur(6px);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
  }
  nav a {
    color: var(--brown-1);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  nav a:hover { color: var(--tan); }
  nav a.active { color: var(--brown-3); font-weight: 600; }

  .nav-links {
    display: flex;
    gap: 2.5rem;
  }

  .nav-toggle {
    display: none;
  }

  @media (max-width: 640px) {
    nav {
      justify-content: flex-end;
      padding: 1.1rem 1.25rem;
    }
    .nav-links {
      display: none;
    }
    .nav-links.open {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: var(--cream);
      gap: 1.75rem;
      font-size: 1.3rem;
      z-index: 150;
      padding: 4rem 2rem 3rem;
      opacity: 0;
      animation: navFadeIn 0.25s ease forwards;
    }
    @keyframes navFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body.nav-open {
      overflow: hidden;
    }
    .nav-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 26px;
      height: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 200;
      padding: 0;
    }
    .nav-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--brown-1);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 9rem 1.5rem 6rem;
    text-align: center;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 0.75rem;
    color: var(--brown-3);
    margin-bottom: 0.4rem;
  }

  h1 {
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 400;
    margin-bottom: 1.5rem;
  }

  main > p.intro {
    margin-bottom: 3rem;
  }

  .contact-block {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 2.5rem 2rem;
    margin-bottom: 2rem;
  }

  .contact-block a {
    color: var(--brown-2);
    text-decoration: none;
    border-bottom: 1px solid var(--brown-2);
  }
  .contact-block a:hover { color: var(--brown-3); }

  .contact-line {
    font-size: 1.1rem;
    margin-bottom: 1rem;
  }
  .contact-line:last-child { margin-bottom: 0; }

  .cta {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.9rem 2.2rem;
    border: 1px solid var(--brown-1);
    border-radius: 9px;
    color: var(--brown-1);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .cta:hover {
    background: #EAD5AA;
    color: #5e2500;
  }

  form {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brown-3);
    margin-bottom: 0.4rem;
  }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    text-transform: none;
    padding: 0.8rem 1rem;
    border: 1px solid rgba(94, 47, 0, 0.25);
    border-radius: 8px;
    background: var(--cream);
    color: var(--brown-1);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--brown-2);
  }
  textarea {
    min-height: 140px;
    resize: vertical;
  }
  button.cta {
    cursor: pointer;
    background: none;
    font-family: inherit;
    align-self: flex-start;
  }
  button.cta:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .form-status {
    font-size: 0.9rem;
    margin-top: 0.5rem;
    display: none;
  }
  .form-status.success { color: #2d5a2d; display: block; }
  .form-status.error { color: #8a2d2d; display: block; }

  footer {
    padding: 3rem 1.5rem;
    text-align: center;
    font-size: 0.85rem;
    background: var(--brown-1);
    color: var(--cream);
  }
  footer a { color: var(--tan); }
  footer p { margin-bottom: 0.4rem; }

  /* ---- Photo grid entrance ---- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    max-width: 900px;
    width: 100%;
    margin: 2.5rem auto 1.5rem;
  }
  .photo-grid img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .photo-grid img.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  @media (max-width: 600px) {
    .photo-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-links" id="nav-links">
    <a href="index.html">home</a>
    <a href="index.html#schedule">schedule</a>
    <a href="teacher-training.html">teacher training</a>
    <a href="index.html#events">events</a>
    <a href="index.html#about">about</a>
    <a href="index.html#purchase">purchase</a>
  </div>
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <h1>Contact</h1>

  <form id="contact-form">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit" class="cta" id="submit-btn">Send Message</button>
    <p id="form-status" class="form-status"></p>
  </form>
  <div class="photo-grid">
    <img src="images/S1_00753-Edit.jpg" alt="">
    <img src="images/0M9A8976-Edit.jpg" alt="">
    <img src="images/S1_00504-Edit.jpg" alt="">
  </div>

</main>

<script>
  const form = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    status.className = 'form-status';
    status.textContent = '';

    const data = {
      name: form.name.value,
      email: form.email.value,
      subject: form.subject.value,
      message: form.message.value,
    };

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (res.ok) {
        status.textContent = "Thanks — your message has been sent.";
        status.className = 'form-status success';
        form.reset();
      } else {
        status.textContent = result.error || 'Something went wrong. Please try again.';
        status.className = 'form-status error';
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again.';
      status.className = 'form-status error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  });
</script>

<script>
  const navToggle = document.getElementById('nav-toggle');
  const navLinks = document.getElementById('nav-links');
  navToggle.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    navToggle.classList.toggle('open');
    document.body.classList.toggle('nav-open');
  });
  navLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      document.body.classList.remove('nav-open');
    });
  });
</script>

<footer>
  <p>hello@castroroom.com</p>
  <p>the castro room</p>
  <p>97 Collingwood Street &middot; San Francisco</p>
  <p>415.529.1261</p>
  <p style="margin-top:1rem;"><a href="https://instagram.com/castro.room" target="_blank">Instagram</a></p>
</footer>

<script>
  const gridObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('img').forEach((img, i) => {
          img.style.transitionDelay = (i * 0.1) + 's';
          img.classList.add('visible');
        });
      }
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('.photo-grid').forEach(g => gridObserver.observe(g));
</script>

</body>
</html>
