<style>
  :root {
    --cream: #FAF9F2;
    --tan: #EAD5AA;
    --brown-1: #5e2f00;
    --brown-2: #5e2500;
    --brown-3: #612000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "proxima-nova", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 300;

    color: var(--brown-1);

    text-transform: lowercase;

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 1.5rem 1.5rem;
    background: rgba(250, 249, 242, 0.9);
    backdrop-filter: blur(6px);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
  }
  nav > a:first-child {
    justify-self: start;
  }
  .nav-logo {
    height: 50px;
    width: auto;
    display: block;
  }
  .nav-links {
    grid-column: 2;
  }
  .nav-toggle {
    justify-self: end;
  }
  nav a {
    color: var(--brown-1);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  nav a:hover { color: var(--tan); }
  nav a.active { color: var(--brown-3); font-weight: 600; }

  .nav-links {
    display: flex;
    gap: 2.5rem;
  }

  .nav-toggle {
    display: none;
  }

  @media (max-width: 640px) {
    nav {
      padding: 1.1rem 1.25rem;
    }
    .nav-links {
      display: none;
    }
    .nav-links.open {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: var(--cream);
      gap: 1.75rem;
      font-size: 1.3rem;
      z-index: 150;
      padding: 4rem 2rem 3rem;
      opacity: 0;
      animation: navFadeIn 0.25s ease forwards;
    }
    @keyframes navFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body.nav-open {
      overflow: hidden;
    }
    .nav-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 26px;
      height: 20px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 200;
      padding: 0;
    }
    .nav-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--brown-1);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  }

  main {

    margin: 0 auto;

  }

  .eyebrow {
    text-transform: uppercase;

  .contact-line {

  .cta {

  /* ---- Photo grid entrance ---- */
  .photo-grid {
    display: grid;

  }
  .photo-grid img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .photo-grid img.visible {
    opacity: 1;
    transform: scale(1);
  }
  @media (max-width: 600px) {
    .photo-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Lightbox ---- */
  .photo-grid img {
    cursor: pointer;
  }
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 0, 0.92);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;

  .lightbox-overlay.open {

  .lightbox-overlay img {

  .lightbox-close {

    top: 1.5rem;
    right: 1.5rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;

    line-height: 1;
    display: flex;

    justify-content: center;
    cursor: pointer;
    z-index: 501;
  }
  .lightbox-close:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  body.lightbox-open {
    overflow: hidden;
  }
</style>

<nav>
  <a href="index.html"><img class="nav-logo" src="images/logo_dark.png" alt="The Castro Room"></a>

    <span></span><span></span><span></span>

</nav>

<main>
  <h1>Contact</h1>

  <form id="contact-form">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit" class="cta" id="submit-btn">Send Message</button>
    <p id="form-status" class="form-status"></p>
  </form>
</main>

<script>
  const form = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    status.className = 'form-status';
    status.textContent = '';

    const data = {
      name: form.name.value,
      email: form.email.value,
      subject: form.subject.value,
      message: form.message.value,
    };

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (res.ok) {
        status.textContent = "Thanks — your message has been sent.";
        status.className = 'form-status success';
        form.reset();
      } else {
        status.textContent = result.error || 'Something went wrong. Please try again.';
        status.className = 'form-status error';
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Please try again.';
      status.className = 'form-status error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  });
</script>

<script>
  const navToggle = document.getElementById('nav-toggle');
  const navLinks = document.getElementById('nav-links');
  navToggle.addEventListener('click', () => {
    navLinks.classList.toggle('open');
    navToggle.classList.toggle('open');
    document.body.classList.toggle('nav-open');
  });
  navLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      document.body.classList.remove('nav-open');
    });
  });
</script>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img src="" alt="" id="lightbox-img">
</div>

<script>
  const gridObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('img').forEach((img, i) => {
          img.style.transitionDelay = (i * 0.05) + 's';
          img.classList.add('visible');
        });
      }
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('.photo-grid').forEach(g => gridObserver.observe(g));

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
    document.body.classList.add('lightbox-open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.classList.remove('lightbox-open');
  }

  document.querySelectorAll('.photo-grid img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.src));
  });
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
